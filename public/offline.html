<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171717">
    <title>Offline · Black Mail</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #ffffff;
            --fg: #171717;
            --muted: #5b6475;
            --primary: #00313A;
            --on-primary: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #171717;
                --fg: #f2f2f2;
                --muted: #a3a3a3;
                --primary: #00313A;
                --on-primary: #ffffff;
            }
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 16px;
            box-sizing: border-box;
            background: var(--bg);
            color: var(--fg);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            text-align: center;
        }

        img {
            width: 72px;
            height: 72px;
            border-radius: 16px;
        }

        h1 {
            font-size: 1.25rem;
            margin: 16px 0 8px;
        }

        p {
            margin: 0 0 24px;
            color: var(--muted);
        }

        button {
            font: inherit;
            padding: 10px 20px;
            border: 0;
            border-radius: 8px;
            background: var(--primary);
            color: var(--on-primary);
            cursor: pointer;
        }
    </style>
</head>
